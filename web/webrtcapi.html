<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC webcam</title>
    <style>
        button {
            padding: 8px 16px;
        }

        video {
            width: 100%;
        }

        .option {
            margin-bottom: 8px;
        }

        #media {
            max-width: 1280px;
        }
    </style>
</head>

<body>
    <div class="option">
        <input id="use-stun" type="checkbox" />
        <label for="use-stun">Use STUN server</label>
    </div>

    <button id="start" onclick="start()">Start</button>

    <button id="stop" style="display: none" onclick="stop()">Stop</button>

    <button class="btn btn-primary" id="btn_start_record">Start Recording</button>

    <button class="btn btn-primary" id="btn_stop_record" disabled>Stop Recording</button>
    <!-- <button class="btn btn-primary" id="btn_download">Download Video</button> -->

    <input type="hidden" id="sessionid" value="0">

    <form class="form-inline" id="echo-form">
        <div class="form-group">
            <p>input text</p>
            <textarea cols="2" rows="3" style="width:600px;height:50px;" class="form-control"
                id="message">test</textarea>
        </div>
        <button type="submit" class="btn btn-default">Send</button>
    </form>

    <div id="media">
        <h2>Media</h2>
        <audio id="audio" autoplay="true"></audio>
        <video id="video" 
               style="width:600px; background: #cccccc;" 
               autoplay 
               playsinline 
               controls></video>
        <div id="video-stats">
            <p>Video status: <span id="video-status">Unknown</span></p>
            <p>Resolution: <span id="video-resolution">Unknown</span></p>
        </div>
        <script>
            // Monitor video element state
            setInterval(() => {
                const video = document.getElementById('video');
                const status = document.getElementById('video-status');
                const resolution = document.getElementById('video-resolution');
                
                status.textContent = video.readyState + (video.paused ? ' (Paused)' : ' (Playing)');
                resolution.textContent = video.videoWidth + 'x' + video.videoHeight;
            }, 1000);
        </script>
    </div>

    <script src="client.js"></script>
    <script type="text/javascript" src="http://cdn.sockjs.org/sockjs-0.3.4.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <script type="text/javascript" charset="utf-8">

            $('#echo-form').on('submit', function (e) {
                // Prevent default form submission
                e.preventDefault();
                // Get message from textarea
                var message = $('#message').val();

                // Send HTTP Post request to the server
                fetch('/v1/human', {
                    body: JSON.stringify({
                        text: message,
                        type: 'echo',
                        interrupt: true,
                        sessionid: parseInt(document.getElementById('sessionid').value),
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                });

                // Clear the textarea after sending
                $('#message').val('');
            });

            $('#btn_start_record').click(function () {
                // Starting recording 
                console.log('Starting recording...');
                // Send HTTP Post request to start recording
                fetch('/v1/record', {
                    body: JSON.stringify({
                        type: 'start_record',
                        sessionid: parseInt(document.getElementById('sessionid').value),
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                }).then(function (response) {
                    if (response.ok) {
                        // Recording started successfully
                        console.log('Recording started successfully.');
                        // Change button states
                        $('#btn_start_record').prop('disabled', true);
                        $('#btn_stop_record').prop('disabled', false);
                        // $('#btn_download').prop('disabled', true);
                    } else {
                        // Recording started failed
                        console.error('Failed to start recording.');
                    }
                }).catch(function (error) {
                    console.error('Error:', error);
                });
            });

            $('#btn_stop_record').click(function () {
                // Stopping recording 
                console.log('Stopping recording...');
                // Send HTTP Post request to stop recording
                fetch('/v1/record', {
                    body: JSON.stringify({
                        type: 'end_record',
                        sessionid: parseInt(document.getElementById('sessionid').value),
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                }).then(function (response) {
                    if (response.ok) {
                        // Recording stopped successfully
                        console.log('Recording stopped.');
                        // Change button states
                        $('#btn_start_record').prop('disabled', false);
                        $('#btn_stop_record').prop('disabled', true);
                        // $('#btn_download').prop('disabled', false);
                    } else {
                        // Recording stopped failed
                        console.error('Failed to stop recording.');
                    }
                }).catch(function (error) {
                    console.error('Error:', error);
                });
            });
