			// Initialize an FLV (Flash Video) player using the mpegts library.
			// It's configured to stream live video from a specific URL.
			flvPlayer = mpegts.createPlayer(
				{
					type: 'flv', 
					url: "http://"+ host + ":8080/live/livestream.flv", 
					isLive: true, 
					enableStashBuffer: false
				}
			);
			// Attach the player to the HTML video element with the ID 'video_player'.
			flvPlayer.attachMediaElement(document.getElementById('video_player'));
			// Load the video stream.
			flvPlayer.load();
			// Start playing the video.
			flvPlayer.play();

			// Send a http request to chat with AI model
			$('#echo-form').on('submit', function (e) {
				e.preventDefault();
				var message = $('#message').val();
				console.log('Sending: ' + message);
				fetch('/human', {
					body: JSON.stringify({
						text: message,
						type: 'chat',
					}),
					headers: {

					},
