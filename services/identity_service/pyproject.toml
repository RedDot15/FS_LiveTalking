[project]
name = "identity-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RedDot15", email = "minhtb03@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.8.0",
    "postgresql-client",
    "uvicorn>=0.35.0",
]

[tool.uv.sources]
postgresql-client = { workspace = true }

[project.scripts]
identity_service = "identity_service:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"
