[project]
name = "indexer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ragnarokishere", email = "ttkien1503@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "base",
    "fastapi>=0.116.1",
    "imageio[ffmpeg,pyav]>=2.37.0",
    "logger",
    "opencv-python>=4.12.0.88",
    "scipy>=1.15.3",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[project.scripts]
indexer = "indexer:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
base = { workspace = true }
logger = { workspace = true }
