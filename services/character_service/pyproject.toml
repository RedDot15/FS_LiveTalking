[project]
name = "character-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huskywannacry", email = "ttkien1503@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "base",
    "fastapi>=0.116.2",
    "logger",
    "mongo-client",
    "pydantic-settings[yaml]>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[project.scripts]
character_service = "character_service:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
base = { workspace = true }
logger = { workspace = true }
mongo-client = { workspace = true }
